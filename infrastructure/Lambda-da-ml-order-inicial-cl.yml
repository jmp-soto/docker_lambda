AWSTemplateFormatVersion: '2010-09-09'
Description: Lambda function for ML Order Initial CL

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, qa, prod]
  ImageUri:
    Type: String
    Description: ECR Image URI
  LambdaName:
    Type: String
    Default: lambda-da-ml-order-inicial-cl

Resources:
  LambdaDaMlOrderInicialCl:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${LambdaName}
      PackageType: Image
      ImageConfig:
        Command:
          - app.handler
      Timeout: 30
      MemorySize: 512
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Role: !GetAtt LambdaExecutionRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Project
          Value: ml-order-system

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${LambdaName}-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: lambda-basic-execution
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*

Outputs:
  LambdaArn:
    Description: ARN of the Lambda function
    Value: !GetAtt LambdaDaMlOrderInicialCl.Arn
  LambdaName:
    Description: Name of the Lambda function
    Value: !Ref LambdaDaMlOrderInicialCl