AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31'

Resources:
  LambdaDaMlOrderInicialCl:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: lambda-da-ml-order-inicial-cl
      PackageType: Image
      Timeout: 60
      MemorySize: 2048
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: ./lambdas/lambda-da-ml-order-inicial-cl  # Changed to relative from repo root
      DockerTag: latest
      Dockerfile: Dockerfile
      BuildArgs:
        BASE_IMAGE: public.ecr.aws/lambda/python:3.12
