# .github/workflows/manual-deploy.yml
name: Manual Lambda Deploy

on:
  workflow_dispatch:
    inputs:
      lambda_name:
        description: 'Nombre de la Lambda a desplegar'
        required: true
        default: 'lambda-da-ml-order-inicial-cl'
      environment:
        description: 'Ambiente de despliegue'
        required: true
        default: 'develop'
        type: choice
        options:
        - develop
        - qa
        - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::682033497219:role/githubrol
          role-session-name: darolesession
          aws-region: us-east-1
      
      - name: Setup SAM
        uses: aws-actions/setup-sam@v2
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Deploy Lambda
        run: |
          bash scripts/deploy-from-title.sh \
          "deploy:${{ github.event.inputs.lambda_name }}"