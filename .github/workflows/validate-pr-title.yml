name: Validate PR Title

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          
          # Check if it's a deploy PR
          if [[ "$TITLE" =~ ^deploy: ]]; then
            echo "✅ Valid deploy PR title: $TITLE"
            
            # Extract lambda names (remove "deploy:" prefix)
            LAMBDA_NAMES="${TITLE#deploy:}"
            LAMBDA_NAMES="${LAMBDA_NAMES// /}"  # Remove spaces
            
            # Split by comma and validate each
            IFS=',' read -ra LAMBDAS <<< "$LAMBDA_NAMES"
            for LAMBDA in "${LAMBDAS[@]}"; do
              if [[ ! -f "infrastructure/${LAMBDA}.yml" && ! -f "infrastructure/${LAMBDA^}.yml" ]]; then
                echo "❌ Template not found for lambda: $LAMBDA"
                echo "Available templates:"
                ls -la infrastructure/*.yml 2>/dev/null || echo "No templates found"
                exit 1
              fi
            done
            
          elif [[ "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore): ]]; then
            echo "✅ Valid non-deploy PR title: $TITLE"
          else
            echo "❌ Invalid PR title format: $TITLE"
            echo "Expected format: deploy:<lambda-name> or feat|fix|docs|style|refactor|test|chore:<description>"
            exit 1
          fi
        shell: bash