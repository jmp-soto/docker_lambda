name: Deploy Lambda by PR Title

on:
  # pull_request:
  #   types: [closed]
  #   branches:
  #     - develop
  #     - qa
  #     - prod
  push:
    branches:
      - develop
      - lambda_prueba_dockers
      - qa
      - prod

permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    # if: >
    #   github.event.pull_request.merged == true &&
    #   startsWith(github.event.pull_request.title, 'deploy:')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        id: creds
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::682033497219:role/githubrol
          role-session-name: darolesession
          aws-region: us-east-1

      - name: Setup SAM
        uses: aws-actions/setup-sam@v2

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3

      - name: Preparar estructura CORRECTA
        run: |
          echo "🔄 PREPARANDO ESTRUCTURA CORRECTA"
          
          # 1. Crear estructura si no existe
          mkdir -p lambdas/Lambda-da-ml-order-inicial-cl/src
          
          # 2. Verificar/crear archivos
          if [ ! -f "lambdas/Lambda-da-ml-order-inicial-cl/src/lambda_function.py" ]; then
            echo "Creando lambda_function.py..."
            cat > lambdas/Lambda-da-ml-order-inicial-cl/src/lambda_function.py << 'EOF'
      import json

      def handler(event, context):
          return {
              'statusCode': 200,
              'body': json.dumps({'message': 'Hello from Lambda!'})
          }
      EOF
          fi
          
          if [ ! -f "lambdas/Lambda-da-ml-order-inicial-cl/src/requirements.txt" ]; then
            echo "Creando requirements.txt..."
            echo "boto3==1.34.0" > lambdas/Lambda-da-ml-order-inicial-cl/src/requirements.txt
          fi
          
          # 3. Crear Dockerfile CORRECTO
          cat > lambdas/Lambda-da-ml-order-inicial-cl/Dockerfile << 'EOF'
      FROM public.ecr.aws/lambda/python:3.12
      RUN microdnf install -y gcc gcc-c++ make && microdnf clean all
      COPY src/requirements.txt .
      RUN pip install --no-cache-dir -r requirements.txt
      COPY src/lambda_function.py ${LAMBDA_TASK_ROOT}
      CMD ["lambda_function.handler"]
      EOF
          
          # 4. Verificar
          echo "✅ Estructura preparada"
          tree lambdas/Lambda-da-ml-order-inicial-cl/
  
      # - name: Deploy Lambda Image
      #   run: |
      #     bash scripts/deploy-from-title.sh \
      #     "${{ github.event.pull_request.title }}"

      - name: Deploy Lambda Image
        run: |
          bash scripts/deploy-from-title.sh \
          "deploy:lambda-da-ml-order-inicial-cl"          