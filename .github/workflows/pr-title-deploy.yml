name: Deploy Lambda from PR Title.

on:
  pull_request:
    types: [closed]
    branches: [develop, qa, prod]

permissions:
  id-token: write
  contents: read

jobs:
  prepare:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-environment.outputs.environment }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      pr_title: ${{ steps.get-title.outputs.pr_title }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Get PR title
        id: get-title
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "PR Title: $PR_TITLE"
      
      - name: Set environment
        id: set-environment
        run: |
          case "${{ github.base_ref }}" in
            develop)
              ENVIRONMENT="dev"
              ;;
            qa)
              ENVIRONMENT="qa"
              ;;
            prod)
              ENVIRONMENT="prod"
              ;;
            *)
              ENVIRONMENT="dev"
              ;;
          esac
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_ENV
      
      - name: Determine matrix for deployment
        id: set-matrix
        run: |
          TITLE="${{ github.event.pull_request.title }}"
          echo "Parsing title: $TITLE"
          
          TITLE_LOWER=$(echo "$TITLE" | tr '[:upper:]' '[:lower:]')
          
          MATRIX='{"include":['
          
          LAMBDAS=(
            "lambda-da-ml-order-inicial-back-office"
            "lambda-da-ml-order-inicial-cl"
          )
          
          if [[ "$TITLE_LOWER" == *"deploy:"* ]]; then
            echo "Encontrado 'deploy:' en el titulo"
            
            DEPLOY_SECTION=$(echo "$TITLE" | grep -i -o "deploy:.*" | cut -d: -f2- | sed 's/ .*//' | xargs)
            echo "Seccion de deploy: '$DEPLOY_SECTION'"
            
            IFS=',' read -ra REQUESTED_LAMBDAS <<< "$DEPLOY_SECTION"
            
            for REQ_LAMBDA in "${REQUESTED_LAMBDAS[@]}"; do
              CLEAN_LAMBDA=$(echo "$REQ_LAMBDA" | xargs | tr '[:upper:]' '[:lower:]')
              
              echo "Buscando: '$CLEAN_LAMBDA'"
              
              for AVAILABLE_LAMBDA in "${LAMBDAS[@]}"; do
                AVAILABLE_LAMBDA_LOWER=$(echo "$AVAILABLE_LAMBDA" | tr '[:upper:]' '[:lower:]')
                
                if [[ "$AVAILABLE_LAMBDA_LOWER" == "$CLEAN_LAMBDA" ]]; then
                  echo "Lambda encontrada: $AVAILABLE_LAMBDA"
                  MATRIX+="{\"lambda\":\"$AVAILABLE_LAMBDA\"},"
                  break
                fi
              done
            done
          fi
          
          if [[ "$MATRIX" == '{"include":[' ]] && [[ "$TITLE_LOWER" == *"-all"* ]]; then
            echo "Encontrado '-all' en el titulo, desplegando todas"
            for LAMBDA in "${LAMBDAS[@]}"; do
              MATRIX+="{\"lambda\":\"$LAMBDA\"},"
            done
          fi
          
          if [[ "$MATRIX" == '{"include":[' ]]; then
            for LAMBDA in "${LAMBDAS[@]}"; do
              LAMBDA_LOWER=$(echo "$LAMBDA" | tr '[:upper:]' '[:lower:]')
              
              if [[ "$TITLE_LOWER" == *"$LAMBDA_LOWER"* ]]; then
                echo "Lambda encontrada en titulo: $LAMBDA"
                MATRIX+="{\"lambda\":\"$LAMBDA\"},"
              fi
            done
          fi
          
          if [[ "$MATRIX" == '{"include":[' ]]; then
            MATRIX='{"include":[]}'
            echo "No se encontraron lambdas para desplegar"
          else
            MATRIX="${MATRIX%,}]}"
            echo "Matriz generada: $MATRIX"
          fi
          
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  deploy-lambdas:
    needs: prepare
    if: ${{ fromJson(needs.prepare.outputs.matrix).include[0] }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: arn:aws:iam::682033497219:role/githubrol
          role-session-name: github-actions-${{ matrix.lambda }}
          aws-region: us-east-1
      
      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
      
      - name: Setup Docker
        uses: docker/setup-buildx-action@v3
      
      - name: Execute deploy-from-title.sh
        env:
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          echo "========================================"
          echo "Ejecutando script de despliegue"
          echo "========================================"
          
          chmod +x scripts/deploy-from-title.sh
          
          ./scripts/deploy-from-title.sh "deploy:${{ matrix.lambda }}" "$ENVIRONMENT"